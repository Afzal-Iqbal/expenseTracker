<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-6">

<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold text-center text-gray-800">💰 Expense Tracker</h1>
    
    <div class="flex space-x-2 mt-4">
        <input type="text" id="expenseTitle" placeholder="Expense Title" class="flex-1 p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300">
        <input type="number" id="expenseAmount" placeholder="Amount ₹" class="flex-1 p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300">
        <button onclick="addExpense()" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">Add Expense</button>
    </div>

    <div class="mt-4" id="expenseList">
        <div class="flex justify-between py-2 border-b border-gray-300">
            <span>Internet Charges</span>
            <span>₹500</span>
        </div>
        <div class="flex justify-between py-2 border-b border-gray-300">
            <span>Train Ticket</span>
            <span>₹250</span>
        </div>
    </div>

    <div class="font-bold mt-4 text-lg">Total Expense: ₹750.00</div>
</div>

<script>
    function addExpense() {
        const title = document.getElementById('expenseTitle').value;
        const amount = document.getElementById('expenseAmount').value;
        const expenseList = document.getElementById('expenseList');

        if (title && amount) {
            const newItem = document.createElement('div');
            newItem.className = 'flex justify-between py-2 border-b border-gray-300';
            newItem.innerHTML = `<span>${title}</span><span>₹${amount}</span>`;
            expenseList.appendChild(newItem);
            document.getElementById('expenseTitle').value = '';
            document.getElementById('expenseAmount').value = '';
            updateTotal();
        }
    }

    function updateTotal() {
        const items = document.querySelectorAll('.flex.justify-between span:nth-child(2)');
        let total = 0;
        items.forEach(item => {
            total += parseFloat(item.innerText.replace('₹', ''));
        });
        document.querySelector('.font-bold').innerText = `Total Expense: ₹${total.toFixed(2)}`;
    }
</script>

</body>
</html>
